<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Akikoi — suivez vos prêts d'objets</title>
  <meta name="description" content="Akikoi — suivez vos prêts d'objets : qui a quoi, depuis quand, rappels au bon moment. Téléchargez l'application sur l'App Store ou Google Play.">
  <link rel="canonical" href="https://akikoi.fr/app/">
  <meta name="robots" content="noindex, follow">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Akikoi">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="Akikoi — suivez vos prêts d'objets">
  <meta property="og:description" content="Qui a quoi, depuis quand, rappels au bon moment. Vos données restent sur votre téléphone.">
  <meta property="og:url" content="https://akikoi.fr/app/">
  <!--
    Bannière plutôt que carré : WhatsApp affiche une image large en vignette
    d'aperçu, alors qu'un carré est rogné — et les dimensions déclarées sont
    les vraies, sans quoi l'aperçu se réserve la mauvaise place.
  -->
  <meta property="og:image" content="https://akikoi.fr/assets/og-banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="../assets/logo.png">
  <link rel="apple-touch-icon" href="../assets/logo.png">
  <link rel="stylesheet" href="../styles.css">

  <!--
    Redirection selon l'appareil, en JavaScript seulement : iPhone/iPad -> App Store,
    Android -> Google Play. Ailleurs (ordinateur, robots), pas de redirection : la
    page montre les deux badges.
  -->
  <script src="../assets/stores.js"></script>
  <script>
    if (window.AKIKOI_STORE.url) location.replace(window.AKIKOI_STORE.url);
  </script>
</head>
<body>
  <!-- Contenu de repli : visible si la redirection ne part pas, et pour les robots -->
  <main class="redirect">
    <div class="container">
      <img class="redirect-logo" src="../assets/logo.png" alt="Akikoi" width="88" height="88">
      <h1>Akikoi — Prêtez sans oublier</h1>
      <p>Qui a quoi, depuis quand, rappels au bon moment. Vos données restent sur votre téléphone.</p>
      <div class="stores">
        <a class="store-badge" href="https://apps.apple.com/app/id6822337850"><img src="../assets/badges/app-store-fr.svg" alt="Télécharger dans l'App Store" width="152" height="48"></a>
        <a class="store-badge" href="https://play.google.com/store/apps/details?id=com.cyriltosi.objetspretes"><img src="../assets/badges/google-play-fr.svg" alt="Disponible sur Google Play" width="162" height="48"></a>
      </div>
      <p class="redirect-note"><a href="../">Retour à l'accueil</a></p>
    </div>
  </main>
</body>
</html>
